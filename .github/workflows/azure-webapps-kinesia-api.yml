name: Deploy KinesIA API to Azure App Service

# GitHub solo ejecuta workflows que están en .github/workflows de la RAÍZ.
# Este workflow reemplaza al archivo legado kinesia-api/.github/workflows/master_kinesia-api.yml.
on:
  push:
    branches:
      - master
    paths:
      - 'kinesia-api/**'
      - '.github/workflows/azure-webapps-kinesia-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinesia-api-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and package API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinesia-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Run AG and API tests
        run: JWT_SECRET=test-secret npm test

      - name: Remove development dependencies
        run: npm prune --omit=dev

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinesia-api
          path: kinesia-api
          if-no-files-found: error
          retention-days: 5

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: kinesia-api

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'kinesia-api'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B07B2DE12271411297382E23A6142905 }}
